<title id="t">Tech stack</title>
<desc id="d">Tech stack. languages: Python, Rust, Java, SQL, Bash. ml &amp; data: PyTorch, Scikit-learn, NumPy, Pandas, Matplotlib, Seaborn, Plotly. backend: FastAPI, PostgreSQL, SQLite, TimescaleDB. infra &amp; cloud: Linux, Nix, Docker, GCP. frontend &amp; ui: Ratatui, Svelte, Tailwind CSS.</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#908caa}.fm{fill:#9ccfd8}.ir{fill:#c4a7e7}.fg{fill:#e0def4}.gr{fill:#56949f}.gd{fill:#f6c177}.lv{fill:#eb6f92}.wh{fill:#f5f4fd}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
