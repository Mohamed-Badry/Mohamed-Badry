<svg xmlns="http://www.w3.org/2000/svg" width="880" height="80" viewBox="0 0 880 80" role="img" aria-labelledby="t d">
<title id="t">End of profile</title>
<desc id="d">Connection closed. Theme inspired by @georgekobaidze.</desc>
<style>
@font-face{font-family:'JBM';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JBM';font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:'JBM',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:15px}
.dim{fill:#908caa}.fm{fill:#9ccfd8}.ir{fill:#c4a7e7}.fg{fill:#e0def4}.gr{fill:#56949f}.gd{fill:#f6c177}.lv{fill:#eb6f92}.wh{fill:#f5f4fd}
@keyframes fadein{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
.ln{animation:fadein .35s ease-out both}
.cursor{animation:blink 1.05s step-end infinite}
.dot{animation:pulse 2s ease-in-out infinite}

@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9ccfd8" stroke-opacity=".06"/></pattern>
<filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
<filter id="g" x="-20%" y="-60%" width="140%" height="220%"><feGaussianBlur stdDeviation="4"/></filter>

</defs>
<path d="M16 -40V64M864 -40V64M16 64H864" fill="none" stroke="#9ccfd8" stroke-width="3" opacity=".45" filter="url(#glow)"/>
<rect x="16" y="0" width="848" height="64" fill="#191724"/>
<rect x="16" y="0" width="848" height="64" fill="url(#grid)"/>
<text x="52" y="30" class="dim"><tspan class="gr">$</tspan> exit</text>
<text x="52" y="52" class="dim">connection to <tspan class="fm">Mohamed-Badry</tspan> closed. <tspan fill="#6e6a86">// EOF</tspan></text>
<text x="828" y="52" text-anchor="end" fill="#6e6a86" style="font-size:11px">// inspired by <tspan class="fm">@georgekobaidze</tspan> ↗</text>
<path d="M16 0V64M864 0V64M16 64H864" fill="none" stroke="#9ccfd8" stroke-width="1.2"/>
<g fill="none" stroke="#9ccfd8" stroke-width="2"><path d="M9 46V71H34"/><path d="M846 71H871V46"/></g>
</svg>
