<text x="32" y="38" letter-spacing="1" class="fm" style="font-size:12px">SYS://MOHAMED-BADRY // NODE:CAIRO</text>
<text x="844" y="38" letter-spacing="1" class="dim" text-anchor="end" style="font-size:12px">ONLINE · ALL SYSTEMS NOMINAL</text>
<circle class="dot" cx="598.4000000000001" cy="34" r="4" fill="#56949f"/>
<circle class="dot" cx="598.4000000000001" cy="34" r="4" fill="#56949f" filter="url(#sglow)"/>
<g clip-path="url(#typeclip)"><text x="52" y="102" class="dim"><tspan class="gr">$</tspan> whoami</text></g>
<g class="name" font-weight="800" letter-spacing="2" style="font-size:56px">
<text x="52" y="172" fill="#9ccfd8" opacity=".45" filter="url(#tglow)" style="font-size:56px">MOHAMED BADRY</text>
<g class="gm"><text x="55" y="172" fill="#eb6f92" opacity=".65" style="font-size:56px">MOHAMED BADRY</text></g>
<g class="gc"><text x="49" y="172" fill="#c4a7e7" opacity=".75" style="font-size:56px">MOHAMED BADRY</text></g>
<text x="52" y="172" fill="#f5f4fd" style="font-size:56px">MOHAMED BADRY</text>
</g>
<g class="ln" style="animation-delay:1.82s"><text class="fg" x="52" y="216"><tspan class="fm">&gt;&gt;</tspan> building developer tools, terminal interfaces, and ml systems</text></g>
<g class="ln" style="animation-delay:2.04s"><text class="fg" x="52" y="242"><tspan class="fm">&gt;&gt;</tspan> rust · python · linux</text></g>
<g class="ln" style="animation-delay:2.4s">
<text x="52" y="280" class="gr">$</text>
<rect class="cursor" x="70" y="267" width="10" height="17" fill="#9ccfd8"/>
<rect class="cursor" x="70" y="267" width="10" height="17" fill="#9ccfd8" filter="url(#sglow)"/>
</g>
<rect x="16" y="51" width="848" height="269" fill="url(#scan)"/>
<path d="M16 16V320M864 16V320M16 16H864" fill="none" stroke="#9ccfd8" stroke-width="1.2"/>
<g fill="none" stroke="#9ccfd8" stroke-width="2"><path d="M9 34V9H34"/><path d="M846 9H871V34"/></g>
</svg>
